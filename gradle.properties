# https://docs.gradle.org/current/userguide/build_environment.html#sec:configuring_jvm_memory
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Configure only necessary projects, useful with multi-module projects
org.gradle.configureondemand=true

# AndroidX Migration https://developer.android.com/jetpack/androidx/migrate
android.useAndroidX=true

# Removes unnecessary default build features
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Required to publish to Nexus (see https://github.com/gradle/gradle/issues/11308)
systemProp.org.gradle.internal.publish.checksums.insecure=true

# Increase timeout when pushing to the Central Portal
systemProp.org.gradle.internal.http.socketTimeout=120000

# ---------------------------------------------------------------------------
# Maven Central / POM coordinates (public, safe to commit)
# ---------------------------------------------------------------------------
GROUP=io.github.astrit-veliu
POM_URL=https://github.com/astrit-veliu/ShowcaseOverlay/
POM_SCM_URL=https://github.com/astrit-veliu/ShowcaseOverlay/
POM_SCM_CONNECTION=scm:git:git://github.com/astrit-veliu/ShowcaseOverlay.git
POM_SCM_DEV_CONNECTION=scm:git:git://github.com/astrit-veliu/ShowcaseOverlay.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=astrit-veliu
POM_DEVELOPER_NAME=Astrit Veliu
POM_DEVELOPER_URL=https://astrit-veliu.github.io/

# CENTRAL_PORTAL is the new (post-OSSRH) Sonatype publishing target.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
SONATYPE_AUTOMATIC_RELEASE=true

# ---------------------------------------------------------------------------
# NEVER put real secrets in this file. It is committed to git.
# mavenCentralUsername / mavenCentralPassword / signingInMemoryKey* are
# supplied at build time via ~/.gradle/gradle.properties (local machine,
# not in the repo) or via GitHub Actions secrets. See README.md > Publishing.
# ---------------------------------------------------------------------------

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
